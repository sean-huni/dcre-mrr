# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_man?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as MRR_BATCH_)
    database-change-log-table: mrr_databasechangelog
    database-change-log-lock-table: mrr_databasechangeloglock

dcre:
  # Telemetry marker, read by platform-batch. Everything else about telemetry (the service name,
  # the instance id, the export flag, the flush, the log appender and the trace context) is
  # resolved inside the library, so this file carries no telemetry configuration of its own and
  # cannot drift from its 29 siblings.
  #
  # Disabled by default: a service run outside the orchestrator behaves exactly as before, and a
  # fresh clone runs with no .env at all (12FactorApp Alignment, https://12factor.net/).
  telemetry:
    enabled: ${DCRE_TELEMETRY_ENABLED:false}
    # OPTIONAL override. Left unset, the library takes this service's own application package
    # leaf, so no service restates its own name here.
    stage: ${DCRE_TELEMETRY_STAGE:}
  batch:
    table-prefix: MRR_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../../infra/dcre-infra/exchange}
  amount-scale: ${DCRE_AMOUNT_SCALE:2}
  mrr:
    max-partitions: ${DCRE_MRR_MAX_PARTITIONS:5}
